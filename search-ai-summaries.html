<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chicago hotel search</title>
    <link rel="stylesheet" href="./assets/css/site.css?v=20260922-2" />
  </head>
  <body data-review-version="with-ai-summary">

    <section class="search-hero" aria-label="Search summary">
      <div class="search-box">
        <div class="search-field">
          <span>Destination</span>
          <strong>Chicago, Illinois</strong>
        </div>
        <div class="search-field">
          <span>Dates</span>
          <strong>3-night stay</strong>
        </div>
        <div class="search-field">
          <span>Occupancy</span>
          <strong>1 room, 1 adult</strong>
        </div>
        <button class="search-submit" type="button">Search</button>
      </div>
    </section>

    <main class="app">
      <div class="layout">
        <section class="content" aria-label="Search results">
          <div class="content__head">
            <h1 class="h1">Chicago: 2 properties found</h1>
            <button class="btn2 shopper-profile-button" type="button" data-view-shopper-profile>View your shopper profile</button>
          </div>
          <p class="survey-copy">View each hotel for at least 10 seconds before closing its popup. Each hotel has a 45-second total viewing limit; reopening resumes the remaining time.</p>

          <div id="results" class="results"></div>
        </section>
      </div>
    </main>

    <div id="modalRoot" class="modal-root" aria-hidden="true"></div>

    <script src="./assets/js/survey-tracking.js?v=20260923-5"></script>
    <script src="./assets/js/survey-storage.js?v=20260923-3"></script>
    <script src="./assets/js/shopper-profile.js?v=20260921-2"></script>
    <script src="./assets/js/hotel-listings.js?v=20260923-2"></script>
  </body>
</html>
