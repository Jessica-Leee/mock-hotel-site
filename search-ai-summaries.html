<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chicago hotel search</title>
    <!-- Streaming to Google Sheets (Apps Script Web App). -->
    <meta
      name="tracking-stream-url"
      content="https://script.google.com/macros/s/AKfycbyBmS8V5n3M0smur248ScVqHNxYG5vZ8Ax9D9ZL38qc_TjiLPuDT04n0ErT57RX_o1V/exec"
    />
    <link rel="stylesheet" href="./assets/css/site.css?v=20260917-1" />
  </head>
  <body data-review-version="with-ai-summary">

    <section class="search-hero" aria-label="Search summary">
      <div class="search-box">
        <div class="search-field">
          <span>Destination</span>
          <strong>Chicago, Illinois</strong>
        </div>
        <div class="search-field">
          <span>Dates</span>
          <strong>3-night stay</strong>
        </div>
        <div class="search-field">
          <span>Occupancy</span>
          <strong>1 room, 1 adult</strong>
        </div>
        <button class="search-submit" type="button">Search</button>
      </div>
    </section>

    <main class="app">
      <div class="layout">
        <section class="content" aria-label="Search results">
          <div class="content__head">
            <h1 class="h1">Chicago: 3 properties found</h1>
            <button class="btn2 shopper-profile-button" type="button" data-view-shopper-profile>View your shopper profile</button>
          </div>
          <div class="survey-notice survey-notice--browse">
            Continue carefully: you cannot return to earlier pages. Open the review popup and AI summary for each hotel before continuing.
          </div>
          <div id="browseCountdown" class="browse-countdown" role="timer">
            <span>Browsing time remaining</span>
            <strong data-countdown-value>1:30</strong>
          </div>

          <div id="results" class="results"></div>
        </section>
      </div>
    </main>

    <div id="modalRoot" class="modal-root" aria-hidden="true"></div>

    <script src="./assets/js/survey-tracking.js?v=20260903-1"></script>
    <script src="./assets/js/shopper-profile.js?v=20260917-1"></script>
    <script src="./assets/js/hotel-listings.js?v=20260917-2"></script>
  </body>
</html>
