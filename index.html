<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotel booking survey</title>
    <!-- Streaming to Google Sheets (Apps Script Web App). -->
    <meta
      name="tracking-stream-url"
      content="https://script.google.com/macros/s/AKfycbyBmS8V5n3M0smur248ScVqHNxYG5vZ8Ax9D9ZL38qc_TjiLPuDT04n0ErT57RX_o1V/exec"
    />
    <link rel="stylesheet" href="./assets/css/site.css?v=20260920-1" />
  </head>
  <body data-survey-page="true">
    <main class="survey-shell" aria-label="Hotel booking survey">
      <section class="survey-card">
        <form id="surveyForm" class="survey-form" autocomplete="off">
          <div id="surveyQuestion"></div>
          <div class="survey-actions">
            <button id="surveySubmit" class="btn" type="submit">Next</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./assets/js/survey-tracking.js?v=20260920-1"></script>
    <script src="./assets/js/shopper-profile.js?v=20260920-1"></script>
    <script>
      (function () {
        const SURVEY_STORAGE_PREFIX = "mock_hotel_survey_v1";
        const SURVEY_EVENT_STORAGE_PREFIX = "mock_hotel_survey_events_v1";
        const SURVEY_OUTBOX_STORAGE_PREFIX = "mock_hotel_survey_outbox_v1";
        const SHARED_ASSIGNMENT_STORAGE_PREFIX = "mock_hotel_shared_assignment_v1";
        const HOTEL_VIEW_STATE_KEY = "mock_hotel_no_review_views_v1";
        const HOTEL_REVIEW_VIEW_STATE_KEY = "mock_hotel_review_views_v1";
        const HOTEL_AI_REVIEW_VIEW_STATE_KEY = "mock_hotel_ai_review_views_v1";
        const HOTEL_ORDER_STORAGE_PREFIX = "mock_hotel_visible_order_v1";
        const SURVEY_USER_ID_STORAGE_PREFIX = "mock_hotel_survey_user_id_v1";
        const SURVEY_USER_ID_CURRENT_KEY = `${SURVEY_USER_ID_STORAGE_PREFIX}:current`;
        const params = new URLSearchParams(location.search);
        const studentId = params.get("STUDENT_ID") || params.get("student_id") || params.get("PROLIFIC_PID") || params.get("prolific_pid") || params.get("participant_id") || "";
        const participantIdentity = studentId || params.get("SESSION_ID") || params.get("session_id") || "";
        const participantStorageId = encodeURIComponent(participantIdentity || "anonymous");
        const requestedStudyCondition = (params.get("study_condition") || "").toLowerCase();
        const studyCondition = requestedStudyCondition === "ai_summary" || params.get("study_version") === "3"
          ? "ai_summary"
          : "full_reviews";
        const studyVersion = studyCondition === "ai_summary" ? "3" : "2";
        const runStorageSuffix = `${participantStorageId}:${studyCondition}`;
        const surveyUserId = getOrCreateSurveyUserId(participantIdentity);
        const STORAGE_KEY = `${SURVEY_STORAGE_PREFIX}:${runStorageSuffix}`;
        const SURVEY_EVENT_STORAGE_KEY = `${SURVEY_EVENT_STORAGE_PREFIX}:${runStorageSuffix}`;
        const SURVEY_OUTBOX_STORAGE_KEY = `${SURVEY_OUTBOX_STORAGE_PREFIX}:${runStorageSuffix}`;
        const SHARED_ASSIGNMENT_STORAGE_KEY = `${SHARED_ASSIGNMENT_STORAGE_PREFIX}:${participantStorageId}`;
        const surveyStage = params.get("survey_stage") || "";
        const hotelQuestionnaireMode = surveyStage === "hotel_questionnaire" || (location.hash || "").startsWith("#hq");
        const postReviewAiMode = surveyStage === "post_review_ai";
        const postReviewMode = surveyStage === "post_review" || postReviewAiMode || (location.hash || "").startsWith("#pr");
        const ASSIGNED_ATTRIBUTE_COUNT = 3;
        let surveyOutboxFlushPromise = null;
        let surveyOutboxRetryTimer = null;

        const hotels = [
          { id: "nobu-hotel-chicago", name: "Hotel B", priceNightly: 145 },
          { id: "arlo-chicago", name: "Hotel A", priceNightly: 143 }
        ];

        function hotelViewStorageKey() {
          return `${HOTEL_VIEW_STATE_KEY}:${hotelViewingRunSuffix()}`;
        }

        function hotelReviewViewStorageKey() {
          const prefix = studyCondition === "ai_summary" ? HOTEL_AI_REVIEW_VIEW_STATE_KEY : HOTEL_REVIEW_VIEW_STATE_KEY;
          return `${prefix}:${hotelViewingRunSuffix()}`;
        }

        function hotelViewingRunSuffix() {
          const browsingRunId = params.get("browsing_run") || params.get("submission_id") || "legacy";
          return `${runStorageSuffix}:${encodeURIComponent(browsingRunId)}`;
        }

        function noReviewViewingComplete() {
          let state = {};
          try { state = JSON.parse(localStorage.getItem(hotelViewStorageKey())) || {}; }
          catch (_) { state = {}; }
          const viewed = new Set(Array.isArray(state.viewedHotelIds) ? state.viewedHotelIds : []);
          return hotels.every(hotel => viewed.has(hotel.id));
        }

        function reviewViewingComplete() {
          let state = {};
          try { state = JSON.parse(localStorage.getItem(hotelReviewViewStorageKey())) || {}; }
          catch (_) { state = {}; }
          const viewed = new Set(Array.isArray(state.viewedHotelIds) ? state.viewedHotelIds : []);
          return hotels.every(hotel => viewed.has(hotel.id));
        }

        if (hotelQuestionnaireMode && !noReviewViewingComplete()) {
          const nextParams = new URLSearchParams(location.search || "");
          if (studentId) nextParams.set("STUDENT_ID", studentId);
          nextParams.set("survey_stage", "search_1");
          location.replace("search-no-reviews.html?" + nextParams.toString());
          return;
        }

        if (postReviewMode && !reviewViewingComplete()) {
          const nextParams = new URLSearchParams(location.search || "");
          if (studentId) nextParams.set("STUDENT_ID", studentId);
          nextParams.set("survey_stage", postReviewAiMode ? "search_3" : "search_2");
          location.replace((postReviewAiMode ? "search-ai-summaries.html?" : "search-reviews.html?") + nextParams.toString());
          return;
        }

        const attributePool = [
          { id: "cleanliness", label: "Cleanliness", likelihoodId: "clean", likelihoodLabel: "Clean" },
          { id: "service_quality", label: "Service quality", likelihoodId: "good_service_quality", likelihoodLabel: "Good Service quality" },
          { id: "room_comfort", label: "Room comfort", likelihoodId: "comfortable_rooms", likelihoodLabel: "Comfortable rooms" },
          { id: "wifi_reliability", label: "Wi-Fi reliability", likelihoodId: "reliable_wifi", likelihoodLabel: "Reliable Wi-Fi" },
          { id: "noise_level", label: "Noise level (quietness)", questionnaireLabel: "Low Noise Level", likelihoodId: "low_noise_level", likelihoodLabel: "Low Noise Level" },
          { id: "location_convenience", label: "Location convenience", likelihoodId: "convenient_location", likelihoodLabel: "Convenient location" },
          { id: "fitness_facilities", label: "Fitness facilities", likelihoodId: "fitness_facilities", likelihoodLabel: "Fitness facilities" },
          { id: "breakfast_quality", label: "Breakfast quality", likelihoodId: "high_quality_breakfast", likelihoodLabel: "High-quality breakfast" }
        ];

        const revealedAttributePool = attributePool;
        const requiredAttributeIds = ["location_convenience", "fitness_facilities"];

        const trueAttributeValues = {
          "nobu-hotel-chicago": {
            cleanliness: 0,
            service_quality: 1,
            room_comfort: 1,
            wifi_reliability: 1,
            noise_level: 1,
            location_convenience: 0,
            fitness_facilities: 0,
            breakfast_quality: 0
          },
          "arlo-chicago": {
            cleanliness: 1,
            service_quality: 0,
            room_comfort: 0,
            wifi_reliability: 1,
            noise_level: 1,
            location_convenience: 1,
            fitness_facilities: 1,
            breakfast_quality: 1
          }
        };

        const matrixConfigs = {
          likelihood: {
            title: hotel => `Select how likely you think ${escapeHtml(hotel.name)} has each attribute.`,
            rows: () => selectedAttributeRows("likelihood"),
            columns: [
              ["extremely_unlikely", "Extremely<br>unlikely"],
              ["somewhat_unlikely", "Somewhat<br>unlikely"],
              ["neither", "Neither likely<br>nor unlikely"],
              ["somewhat_likely", "Somewhat likely"],
              ["extremely_likely", "Extremely likely"]
            ]
          }
        };

        const scenarios = [
          {
            id: "solo_city_exploration",
            title: "Trip Scenario: Solo City Exploration",
            description: "You are booking for yourself as a solo leisure traveler. Duration: 3 nights. Budget: up to $150/night. You will be out most of the day and need a comfortable, well-located base.",
            rows: [
              ["Cleanliness", "2 - moderately important", false],
              ["Service quality", "2 - moderately important", false],
              ["Room comfort", "2 - moderately important", false],
              ["Wi-Fi reliability", "2 - moderately important", false],
              ["Noise level (quietness)", "2 - moderately important", false],
              ["Location convenience", "3 - most important", true],
              ["Fitness facilities", "3 - most important", true],
              ["Breakfast quality", "1 - least important", false]
            ]
          }
        ];

        function hotelMatrixPages(prefix) {
          return hotels.map(hotel => (
            { id: `${prefix}_${hotel.id}_likelihood`, type: "hotelMatrix", matrix: "likelihood", hotel }
          ));
        }

        const hotelQuestionnairePages = hotelMatrixPages("hotelq");
        const postReviewOutcomePages = [
          { id: "post_review_choice", type: "hotelChoice" },
          { id: "post_review_reveal", type: "actualReveal" },
          { id: "post_review_likelihood_surprise", type: "likelihoodSurprise" },
          { id: "post_review_satisfaction", type: "likert7" },
          { id: "post_review_switch", type: "switchChoice" },
          { id: "post_review_ai_use_frequency", type: "aiUseFrequency" }
        ];
        const postReviewPages = [
          ...hotelMatrixPages("postreview"),
          ...postReviewOutcomePages
        ];

        function standardPages() {
          const scenario = assignedScenario();
          return [
            { id: "student_id", type: "studentId" },
            { id: scenario.id, type: "scenario", scenario },
            { id: "browse_intro", type: "browseIntro" }
          ];
        }

        function activePages() {
          if (postReviewMode) return postReviewPages;
          return hotelQuestionnaireMode ? hotelQuestionnairePages : standardPages();
        }

        function getState() {
          try {
            const stored = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
            const state = stored ? JSON.parse(stored) : { answers: {} };
            if (!state.answers || typeof state.answers !== "object") state.answers = {};
            delete state.answers.hotel_scenarios_prior;
            delete state.answers.hotel_attributes_prior;
            Object.keys(state.answers).forEach(answerId => {
              if (/^(hotelq|postreview)_.+_confidence$/.test(answerId)) delete state.answers[answerId];
            });
            delete state.answers.post_review_confidence_surprise;
            return state;
          }
          catch (_) { return { answers: {} }; }
        }

        function setState(state) {
          const serialized = JSON.stringify(state);
          try { localStorage.setItem(STORAGE_KEY, serialized); }
          catch (_) { /* sessionStorage remains as a fallback */ }
          try { sessionStorage.setItem(STORAGE_KEY, serialized); }
          catch (_) { /* storage can be unavailable in strict privacy modes */ }
        }

        function createRecordId(prefix) {
          try {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
              return `${prefix}_${window.crypto.randomUUID()}`;
            }
          } catch (_) {
            /* fall through */
          }
          return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 12)}`;
        }

        function persistSurveyUserId(id, identity) {
          if (!id) return;
          const key = `${SURVEY_USER_ID_STORAGE_PREFIX}:${encodeURIComponent(identity || "anonymous")}`;
          try {
            sessionStorage.setItem(key, id);
            sessionStorage.setItem(SURVEY_USER_ID_CURRENT_KEY, id);
          } catch (_) {
            /* storage can be unavailable in strict privacy modes */
          }
          if (identity) {
            try { localStorage.setItem(key, id); }
            catch (_) { /* sessionStorage remains as a fallback */ }
          }
        }

        function copyStorageValue(sourceKey, targetKey, fallbackValue) {
          let value = fallbackValue;
          if (value === undefined) {
            try { value = localStorage.getItem(sourceKey); }
            catch (_) { value = null; }
            if (value === null) {
              try { value = sessionStorage.getItem(sourceKey); }
              catch (_) { value = null; }
            }
          }
          if (value === null || value === undefined) return;
          try { localStorage.setItem(targetKey, value); }
          catch (_) { /* sessionStorage remains as a fallback */ }
          try { sessionStorage.setItem(targetKey, value); }
          catch (_) { /* storage can be unavailable in strict privacy modes */ }
        }

        function migrateParticipantStorage(identity, state) {
          const normalizedIdentity = String(identity || "").trim();
          if (!normalizedIdentity) return;
          const targetParticipantStorageId = encodeURIComponent(normalizedIdentity);
          if (targetParticipantStorageId === participantStorageId) return;

          const targetRunStorageSuffix = `${targetParticipantStorageId}:${studyCondition}`;
          copyStorageValue(
            STORAGE_KEY,
            `${SURVEY_STORAGE_PREFIX}:${targetRunStorageSuffix}`,
            JSON.stringify(state || getState())
          );
          copyStorageValue(
            SURVEY_EVENT_STORAGE_KEY,
            `${SURVEY_EVENT_STORAGE_PREFIX}:${targetRunStorageSuffix}`
          );
          copyStorageValue(
            SURVEY_OUTBOX_STORAGE_KEY,
            `${SURVEY_OUTBOX_STORAGE_PREFIX}:${targetRunStorageSuffix}`
          );
          copyStorageValue(
            SHARED_ASSIGNMENT_STORAGE_KEY,
            `${SHARED_ASSIGNMENT_STORAGE_PREFIX}:${targetParticipantStorageId}`,
            JSON.stringify((state && state.assignment) || ensureRandomization())
          );
        }

        function getOrCreateSurveyUserId(identity) {
          const key = `${SURVEY_USER_ID_STORAGE_PREFIX}:${encodeURIComponent(identity || "anonymous")}`;
          let id = "";
          try { id = sessionStorage.getItem(key) || ""; }
          catch (_) { /* continue */ }
          if (!id && identity) {
            try { id = localStorage.getItem(key) || ""; }
            catch (_) { /* continue */ }
          }
          if (!id && !identity) {
            try { id = sessionStorage.getItem(SURVEY_USER_ID_CURRENT_KEY) || ""; }
            catch (_) { /* continue */ }
          }
          if (!id) id = createRecordId("survey_user");
          persistSurveyUserId(id, identity);
          return id;
        }

        function ensureSubmissionId(state) {
          if (!state.submission_id) state.submission_id = createRecordId("submission");
          if (!state.started_at) state.started_at = new Date().toISOString();
          return state.submission_id;
        }

        function randomInteger(max) {
          if (max <= 0) return 0;
          try {
            if (window.crypto && window.crypto.getRandomValues) {
              const array = new Uint32Array(1);
              window.crypto.getRandomValues(array);
              return array[0] % max;
            }
          } catch (_) {
            /* fall through to Math.random */
          }
          return Math.floor(Math.random() * max);
        }

        function shuffled(items) {
          const copy = items.slice();
          for (let i = copy.length - 1; i > 0; i -= 1) {
            const j = randomInteger(i + 1);
            const temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
          }
          return copy;
        }

        function stableShuffled(items, seedText) {
          let seed = 2166136261;
          const normalized = String(seedText || "");
          for (let i = 0; i < normalized.length; i++) {
            seed ^= normalized.charCodeAt(i);
            seed = Math.imul(seed, 16777619);
          }
          const random = function () {
            seed += 0x6D2B79F5;
            let value = seed;
            value = Math.imul(value ^ (value >>> 15), value | 1);
            value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
            return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
          };
          const copy = items.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            const temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
          }
          return copy;
        }

        function getSharedAssignment() {
          try {
            const stored = localStorage.getItem(SHARED_ASSIGNMENT_STORAGE_KEY);
            return stored ? JSON.parse(stored) : {};
          } catch (_) {
            return {};
          }
        }

        function setSharedAssignment(assignment) {
          try { localStorage.setItem(SHARED_ASSIGNMENT_STORAGE_KEY, JSON.stringify(assignment || {})); }
          catch (_) { /* the condition-specific state remains as a fallback */ }
        }

        function ensureRandomization() {
          const state = getState();
          const sharedAssignment = getSharedAssignment();
          const assignment = Object.assign({}, state.assignment || {}, sharedAssignment);
          let changed = false;

          if (!state.submission_id || !state.started_at) {
            ensureSubmissionId(state);
            changed = true;
          }

          if (!state.survey_user_id) {
            state.survey_user_id = surveyUserId;
            changed = true;
          }

          if (state.study_condition !== studyCondition || state.study_version !== studyVersion) {
            state.study_condition = studyCondition;
            state.study_version = studyVersion;
            changed = true;
          }

          const scenario = scenarios[0];
          if (assignment.scenario_id !== scenario.id || assignment.scenario_title !== scenario.title) {
            assignment.scenario_id = scenario.id;
            assignment.scenario_title = scenario.title;
            changed = true;
          }

          const optionalAttributeIds = attributePool.map(attribute => attribute.id)
            .filter(id => !requiredAttributeIds.includes(id));
          const assignmentIdentity = String(state.student_id || studentId || participantIdentity || surveyUserId).trim().toUpperCase();
          // Derive the same third attribute in both conditions, including when replacing a cached legacy assignment.
          assignment.attribute_ids = requiredAttributeIds.concat(
            stableShuffled(optionalAttributeIds, `hotel-attributes-v2:${assignmentIdentity}`)
              .slice(0, ASSIGNED_ATTRIBUTE_COUNT - requiredAttributeIds.length)
          );
          assignment.attribute_labels = assignment.attribute_ids.map(id => {
            const attribute = attributePool.find(item => item.id === id);
            return attribute ? attribute.label : id;
          });

          if (!assignment.assigned_at) {
            assignment.assigned_at = new Date().toISOString();
            changed = true;
          }

          setSharedAssignment(assignment);
          if (changed || JSON.stringify(state.assignment) !== JSON.stringify(assignment)) {
            state.assignment = assignment;
            state.updated_at = new Date().toISOString();
            setState(state);
          }
          return assignment;
        }

        function assignedScenario() {
          const assignment = ensureRandomization();
          return scenarios.find(scenario => scenario.id === assignment.scenario_id) || scenarios[0];
        }

        function selectedAttributeRows(kind) {
          const assignment = ensureRandomization();
          const attributes = (assignment.attribute_ids || [])
            .map(id => attributePool.find(attribute => attribute.id === id))
            .filter(Boolean);
          return attributes.map(attribute => kind === "likelihood"
            ? [attribute.likelihoodId, attribute.likelihoodLabel]
            : [attribute.id, attribute.questionnaireLabel || attribute.label]
          );
        }

        function chosenHotelId() {
          const state = getState();
          const answer = state.answers && state.answers.post_review_choice;
          return answer && answer.hotel_id ? answer.hotel_id : "";
        }

        function chosenHotel() {
          const id = chosenHotelId();
          return hotels.find(hotel => hotel.id === id) || hotels[0];
        }

        function trueAttributesFor(hotelId) {
          return trueAttributeValues[hotelId] || {};
        }

        function getSurveyEvents() {
          try {
            const stored = localStorage.getItem(SURVEY_EVENT_STORAGE_KEY) || sessionStorage.getItem(SURVEY_EVENT_STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
          }
          catch (_) { return []; }
        }

        function setSurveyEvents(events) {
          const serialized = JSON.stringify(events);
          try { localStorage.setItem(SURVEY_EVENT_STORAGE_KEY, serialized); }
          catch (_) { /* sessionStorage remains as a fallback */ }
          try { sessionStorage.setItem(SURVEY_EVENT_STORAGE_KEY, serialized); }
          catch (_) { /* storage can be unavailable in strict privacy modes */ }
        }

        function getMeta(name) {
          const meta = document.querySelector(`meta[name="${name}"]`);
          return meta && meta.getAttribute("content") ? meta.getAttribute("content").trim() : "";
        }

        function prolificMeta(state) {
          const currentStudentId = (state && (state.student_id || state.prolific_id)) || studentId;
          return {
            survey_user_id: (state && state.survey_user_id) || surveyUserId,
            student_id: currentStudentId,
            prolific_pid: params.get("PROLIFIC_PID") || params.get("prolific_pid") || currentStudentId,
            study_id: params.get("STUDY_ID") || params.get("study_id") || "",
            session_id: params.get("SESSION_ID") || params.get("session_id") || "",
            submission_id: (state && state.submission_id) || params.get("submission_id") || "",
            study_condition: studyCondition,
            study_version: studyVersion
          };
        }

        function surveyStreamUrl() {
          return getMeta("tracking-stream-url") || params.get("stream") || "";
        }

        function getSurveyOutbox() {
          try {
            const stored = localStorage.getItem(SURVEY_OUTBOX_STORAGE_KEY) || sessionStorage.getItem(SURVEY_OUTBOX_STORAGE_KEY);
            const outbox = stored ? JSON.parse(stored) : [];
            return Array.isArray(outbox) ? outbox : [];
          } catch (_) {
            return [];
          }
        }

        function setSurveyOutbox(outbox) {
          const serialized = JSON.stringify(outbox.slice(-500));
          try { localStorage.setItem(SURVEY_OUTBOX_STORAGE_KEY, serialized); }
          catch (_) { /* sessionStorage remains as a fallback */ }
          try { sessionStorage.setItem(SURVEY_OUTBOX_STORAGE_KEY, serialized); }
          catch (_) { /* storage can be unavailable in strict privacy modes */ }
        }

        function enqueueSurveyPayload(payload) {
          const payloadId = payload && payload.events && payload.events[0] && payload.events[0].event_id;
          if (!payloadId) return;
          const outbox = getSurveyOutbox();
          if (!outbox.some(item => item.id === payloadId)) {
            outbox.push({ id: payloadId, queued_at: Date.now(), attempts: 0, payload });
            setSurveyOutbox(outbox);
          }
        }

        function removeSurveyOutboxItems(ids) {
          const sentIds = new Set(ids);
          setSurveyOutbox(getSurveyOutbox().filter(item => !sentIds.has(item.id)));
        }

        function scheduleSurveyOutboxRetry() {
          if (surveyOutboxRetryTimer || !getSurveyOutbox().length) return;
          surveyOutboxRetryTimer = window.setTimeout(() => {
            surveyOutboxRetryTimer = null;
            flushSurveyOutbox("retry");
          }, 5000);
        }

        function flushSurveyOutbox(reason, preferBeacon) {
          const streamUrl = surveyStreamUrl();
          const queued = getSurveyOutbox();
          if (!streamUrl || !queued.length) return Promise.resolve({ dispatched: 0, pending: queued.length });

          if (preferBeacon && navigator.sendBeacon) {
            const acceptedIds = [];
            queued.slice(0, 40).forEach(item => {
              try {
                const payload = Object.assign({}, item.payload, { reason: reason || item.payload.reason });
                const accepted = navigator.sendBeacon(
                  streamUrl,
                  new Blob([JSON.stringify(payload)], { type: "text/plain;charset=utf-8" })
                );
                if (accepted) acceptedIds.push(item.id);
              } catch (_) {
                /* keep the item for the next page load */
              }
            });
            if (acceptedIds.length) removeSurveyOutboxItems(acceptedIds);
            return Promise.resolve({ dispatched: acceptedIds.length, pending: getSurveyOutbox().length });
          }

          if (surveyOutboxFlushPromise) return surveyOutboxFlushPromise;
          surveyOutboxFlushPromise = (async () => {
            let dispatched = 0;
            const batch = getSurveyOutbox().slice(0, 40);
            for (const item of batch) {
              try {
                const payload = Object.assign({}, item.payload, { reason: reason || item.payload.reason });
                await fetch(streamUrl, {
                  method: "POST",
                  mode: "no-cors",
                  keepalive: true,
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify(payload)
                });
                removeSurveyOutboxItems([item.id]);
                dispatched += 1;
              } catch (_) {
                const outbox = getSurveyOutbox();
                const pending = outbox.find(candidate => candidate.id === item.id);
                if (pending) {
                  pending.attempts = Number(pending.attempts || 0) + 1;
                  pending.last_attempt_at = Date.now();
                  setSurveyOutbox(outbox);
                }
                break;
              }
            }
            return { dispatched, pending: getSurveyOutbox().length };
          })().finally(() => {
            surveyOutboxFlushPromise = null;
            scheduleSurveyOutboxRetry();
          });
          return surveyOutboxFlushPromise;
        }

        function streamSurveyEvent(entry, state) {
          if (!surveyStreamUrl()) return;
          const payload = {
            v: 2,
            kind: "survey_event",
            page_url: location.href,
            phase: "survey",
            cond: studyCondition,
            reason: entry.event_type,
            prolific: prolificMeta(state),
            events: [entry]
          };
          enqueueSurveyPayload(payload);
          flushSurveyOutbox("survey_event");
        }

        function logSurveyEvent(page, answer, state) {
          const surveyState = state || getState();
          const submissionId = ensureSubmissionId(surveyState);
          setState(surveyState);
          const entry = {
            event_id: createRecordId("survey_event"),
            event_type: "survey_submit",
            element_id: page.id,
            timestamp: Date.now(),
            value: {
              survey_user_id: surveyState.survey_user_id || surveyUserId,
              answer,
              survey_page: page.type || "transition",
              assignment: surveyState.assignment || null,
              submission_id: submissionId
            }
          };
          const events = getSurveyEvents();
          events.push(entry);
          setSurveyEvents(events);
          streamSurveyEvent(entry, surveyState);
        }

        function storedJson(key) {
          try { return JSON.parse(localStorage.getItem(key)) || {}; }
          catch (_) { return {}; }
        }

        function logCompletionSnapshot(state) {
          const submissionId = ensureSubmissionId(state);
          const eventId = `${submissionId}:completion_snapshot`;
          const existingEvents = getSurveyEvents();
          let entry = existingEvents.find(event => event.event_id === eventId);
          if (!entry) {
            const behaviorPayload = typeof window.HOTEL_EXPERIMENT_GET_PAYLOAD === "function"
              ? window.HOTEL_EXPERIMENT_GET_PAYLOAD()
              : null;
            entry = {
              event_id: eventId,
              event_type: "survey_completion_snapshot",
              element_id: "survey_completion_snapshot",
              timestamp: Date.now(),
              value: {
                snapshot_version: 1,
                survey_user_id: state.survey_user_id || surveyUserId,
                submission_id: submissionId,
                study_condition: studyCondition,
                study_version: studyVersion,
                completion_status: "complete",
                completed_at: state.completed_at,
                prolific: prolificMeta(state),
                assignment: state.assignment || null,
                answers: state.answers || {},
                no_review_viewing: storedJson(hotelViewStorageKey()),
                with_review_viewing: studyCondition === "full_reviews" ? storedJson(hotelReviewViewStorageKey()) : {},
                with_ai_summary_viewing: studyCondition === "ai_summary" ? storedJson(hotelReviewViewStorageKey()) : {},
                survey_event_count: existingEvents.length,
                current_page_behavior_event_count: behaviorPayload && Array.isArray(behaviorPayload.events)
                  ? behaviorPayload.events.length
                  : 0
              }
            };
            existingEvents.push(entry);
            setSurveyEvents(existingEvents);
          }
          streamSurveyEvent(entry, state);
        }

        function hotelOrderStorageKey() {
          return `${HOTEL_ORDER_STORAGE_PREFIX}:${participantStorageId}`;

        function hotelBrowsingOrder() {
          const hotelById = new Map(hotels.map(hotel => [hotel.id, hotel]));
          try {
            const stored = JSON.parse(localStorage.getItem(hotelOrderStorageKey()) || "[]");
            const ordered = Array.isArray(stored) ? stored.map(id => hotelById.get(id)).filter(Boolean) : [];
            if (ordered.length === hotels.length && new Set(ordered.map(hotel => hotel.id)).size === hotels.length) {
              return ordered;
            }
          } catch (_) { /* use the default order below */ }
          if (!participantIdentity) return hotels.slice();
          const orderedIds = stableShuffled(
            hotels.map(hotel => hotel.id),
            `hotel-order-v1:${participantStorageId.toUpperCase()}`
          );
          try { localStorage.setItem(hotelOrderStorageKey(), JSON.stringify(orderedIds)); }
          catch (_) { /* the deterministic order can be recomputed */ }
          return orderedIds.map(id => hotelById.get(id)).filter(Boolean);
        }

        function postReviewChoiceFor(hotelId, attribute) {
          const state = getState();
          const answers = state.answers || {};

          const responseCode = values[attribute.likelihoodId] || "";
          const assignedIds = state.assignment && Array.isArray(state.assignment.attribute_ids)
            ? state.assignment.attribute_ids
            : [];

          if (!responseCode) return assignedIds.includes(attribute.id) ? "No response" : "Not asked";
          const option = matrixConfigs.likelihood.columns.find(column => column[0] === responseCode);
          return option ? option[1].replace(/<br>/g, " ") : responseCode.replace(/_/g, " ");
        }

            setQuestionHtml(aiUseFrequencyHtml());
          } else {
            const secondStage = studyCondition === "ai_summary"
              ? "the version with AI-generated review summaries"
              : "the version with full reviews";
            setQuestionHtml(`
              <h1 class="survey-title">Next: Browse Hotel Listings</h1>
              <p class="survey-copy">You will now view 2 hotel listings. You can reopen each hotel's popup, with a total viewing limit of 45 seconds per hotel in each browsing stage.</p>
              <p class="survey-copy">First you will see listings without reviews. After that, you will continue to ${secondStage}.</p>
            `);
          }
        }

        function saveAnswer(page) {
          const state = getState();
          const assignment = ensureRandomization();
          state.student_id = state.student_id || state.prolific_id || studentId;
          state.updated_at = new Date().toISOString();
          state.assignment = assignment;
          state.answers = state.answers || {};
          if (page.type === "studentId") {
            const value = document.getElementById("answerInput").value.trim();
            state.student_id = value;
            delete state.prolific_id;
            state.survey_user_id = state.survey_user_id || surveyUserId;
            persistSurveyUserId(state.survey_user_id, value);
            const detection = botDetectionData();
            if (/^wrong\s+id$/i.test(value)) {
              detection.bot_detection_triggered = true;
              detection.bot_detection_response = "wrong id (Student ID field)";
            }
            state.answers[page.id] = { value, ...detection, submitted_at: state.updated_at };
          } else if (page.type === "scenario") {
            state.answers[page.id] = {
              value: true,
              scenario_id: page.scenario.id,
              scenario_title: page.scenario.title,
              submitted_at: state.updated_at
            };
          } else if (page.type === "hotelMatrix") {
            const config = matrixConfigs[page.matrix];
            const rows = typeof config.rows === "function" ? config.rows() : config.rows;
            const values = {};
            rows.forEach(row => {
              const selected = document.querySelector(`input[name="${row[0]}"]:checked`);
              values[row[0]] = selected ? selected.value : "";
            });
            state.answers[page.id] = {
              hotel_id: page.hotel.id,
              hotel_name: page.hotel.name,
              matrix: page.matrix,
              questionnaire_stage: postReviewAiMode ? "with_ai_summary" : postReviewMode ? "with_reviews" : "no_reviews",
              assigned_attribute_ids: assignment.attribute_ids || [],
              assigned_attribute_labels: assignment.attribute_labels || [],
              values,
              ...botDetectionData(),
              submitted_at: state.updated_at
            };
          } else if (page.type === "hotelChoice") {
            const selected = document.querySelector(`input[name="chosen_hotel"]:checked`);
            const hotelId = selected ? selected.value : "";
            const hotel = hotels.find(item => item.id === hotelId);
            state.answers[page.id] = {
              hotel_id: hotelId,
              hotel_name: hotel ? hotel.name : "",
              submitted_at: state.updated_at
            };
          } else if (page.type === "actualReveal") {
            const hotel = chosenHotel();
            state.answers[page.id] = {
              value: true,
              hotel_id: hotel.id,
              hotel_name: hotel.name,
              true_attributes: trueAttributesFor(hotel.id),
              submitted_at: state.updated_at
            };
          } else if (page.type === "likert7") {
            const selected = document.querySelector(`input[name="satisfaction"]:checked`);
            state.answers[page.id] = {
              value: selected ? selected.value : "",
              hotel_id: chosenHotel().id,
              hotel_name: chosenHotel().name,
              submitted_at: state.updated_at
            };
          } else if (page.type === "switchChoice") {
            const selected = document.querySelector(`input[name="switch_choice"]:checked`);
            state.answers[page.id] = {
              value: selected ? selected.value : "",
              hotel_id: chosenHotel().id,
              hotel_name: chosenHotel().name,
              submitted_at: state.updated_at
            };
          } else if (page.type === "rangeLikelihood") {
            const input = document.querySelector('input[name="switch_likelihood"]:checked');
            state.answers[page.id] = {
              value: input ? input.value : "",
              hotel_id: chosenHotel().id,
              hotel_name: chosenHotel().name,
              submitted_at: state.updated_at
            };
          } else if (page.type === "attributeSurprise") {
            const values = {};
            selectedAttributeRows("surprise").forEach(row => {
              const input = document.querySelector(`input[name="${row[0]}"]:checked`);
              values[row[0]] = input ? input.value : "";
            });
            state.answers[page.id] = {
              hotel_id: chosenHotel().id,
              hotel_name: chosenHotel().name,
              values,
              submitted_at: state.updated_at
            };
          } else if (page.type === "likelihoodSurprise") {
            const likelihoodInput = document.querySelector(`input[name="switch_likelihood"]:checked`);
            const values = {};
            selectedAttributeRows("surprise").forEach(row => {
              const input = document.querySelector(`input[name="${row[0]}"]:checked`);
              values[row[0]] = input ? input.value : "";
            });
            state.answers[page.id] = {
              hotel_id: chosenHotel().id,
              hotel_name: chosenHotel().name,
              switch_likelihood: likelihoodInput ? likelihoodInput.value : "",
              surprise_values: values,
              submitted_at: state.updated_at
            };
          } else if (page.type === "aiUseFrequency") {
            const selected = document.querySelector('input[name="ai_use_frequency"]:checked');
            state.answers[page.id] = {
              value: selected ? selected.value : "",
              submitted_at: state.updated_at
            };
          }
          setState(state);
          logSurveyEvent(page, state.answers[page.id], state);
          if (page.type === "studentId") migrateParticipantStorage(state.student_id, state);
          return state;
        }

        function goToHotelBrowsing(state) {
          const nextParams = new URLSearchParams(location.search || "");
          const surveyState = state || getState();
          const sid = surveyState.student_id || surveyState.prolific_id || studentId || "";
          if (sid) nextParams.set("STUDENT_ID", sid);
          nextParams.set("submission_id", ensureSubmissionId(surveyState));
          const browsingRunId = createRecordId("browsing_run");
          surveyState.browsing_run_id = browsingRunId;
          nextParams.set("browsing_run", browsingRunId);
          nextParams.set("study_condition", studyCondition);
          nextParams.set("study_version", studyVersion);
          setState(surveyState);
          nextParams.set("survey_stage", "search_1");
          logSurveyEvent({ id: "browse_intro", type: "transition" }, { value: "start_hotel_browsing" }, surveyState);
          migrateParticipantStorage(sid, surveyState);
          location.replace("search-no-reviews.html?" + nextParams.toString());
        }

        function goToReviewBrowsing(state) {
          const nextParams = new URLSearchParams(location.search || "");
          const surveyState = state || getState();
          const sid = surveyState.student_id || surveyState.prolific_id || studentId || "";
          if (sid) nextParams.set("STUDENT_ID", sid);
          nextParams.set("submission_id", ensureSubmissionId(surveyState));
          const browsingRunId = params.get("browsing_run") || surveyState.browsing_run_id || createRecordId("browsing_run");
          surveyState.browsing_run_id = browsingRunId;
          nextParams.set("browsing_run", browsingRunId);
          nextParams.set("study_condition", studyCondition);
          nextParams.set("study_version", studyVersion);
          setState(surveyState);
          const useAiSummary = studyCondition === "ai_summary";
          nextParams.set("survey_stage", useAiSummary ? "search_3" : "search_2");
          logSurveyEvent(
            { id: "hotel_questionnaire_complete", type: "transition" },
            { value: useAiSummary ? "start_ai_summary_review_browsing" : "start_review_browsing" },
            surveyState
          );
          location.replace((useAiSummary ? "search-ai-summaries.html?" : "search-reviews.html?") + nextParams.toString());
        }

        function renderCompletionScreen() {
          document.getElementById("surveyQuestion").innerHTML = `
            <div class="survey-complete">
              <h1 class="survey-title">Website task complete</h1>
              <p class="survey-copy">Your responses on this website have been saved.</p>
              <div class="survey-debrief" role="note">
                <h2>Debriefing</h2>
                <p>The product attributes and reviews shown in this study were hypothetical materials created for research purposes. They should not be interpreted as factual information about the hotels.</p>
              </div>
              <div class="survey-complete__instruction" role="status">
                <strong>Return to the Qualtrics survey</strong>
                <p>Please return to the Qualtrics tab now to continue the study and submit your response.</p>
              </div>
            </div>
          `;
          document.getElementById("surveySubmit").hidden = true;
        }

        function finishPostReviewQuestionnaire(state) {
          const finalState = state || getState();
          ensureSubmissionId(finalState);
          finalState.completion_status = "complete";
          finalState.completed_at = finalState.completed_at || new Date().toISOString();
          finalState.updated_at = new Date().toISOString();
          setState(finalState);
          logSurveyEvent({ id: "post_review_complete", type: "transition" }, { value: "complete" }, finalState);
          logCompletionSnapshot(finalState);
          flushSurveyOutbox("survey_complete");
          renderCompletionScreen();
          history.replaceState(null, "", location.pathname + (location.search || "") + "#complete");
        }

        document.addEventListener("click", function (event) {
          const openButton = event.target && event.target.closest && event.target.closest("[data-view-hotel-order]");
          if (openButton) {
            openHotelOrderModal(openButton);
            return;
          }
          const closeButton = event.target && event.target.closest && event.target.closest("[data-close-hotel-order]");
          if (closeButton) {
            closeHotelOrderModal();
            return;
          }
          const revealedButton = event.target && event.target.closest && event.target.closest("[data-view-revealed-attributes]");
          if (revealedButton) {
            openRevealedAttributesModal(revealedButton);
            return;
          }
          const closeRevealedButton = event.target && event.target.closest && event.target.closest("[data-close-revealed-attributes]");
          if (closeRevealedButton) closeRevealedAttributesModal();
        });

        document.addEventListener("keydown", function (event) {
          const root = document.getElementById("hotelOrderModalRoot");
          const revealedRoot = document.getElementById("revealedAttributesModalRoot");
          if (event.key !== "Escape") return;
          if (revealedRoot && revealedRoot.classList.contains("is-open")) {
            event.preventDefault();
            event.stopImmediatePropagation();
            closeRevealedAttributesModal();
            return;
          }
          if (root && root.classList.contains("is-open")) {
            event.preventDefault();
            event.stopImmediatePropagation();
            closeHotelOrderModal();
          }
        }, true);

        document.getElementById("surveyForm").addEventListener("submit", function (event) {
          event.preventDefault();
          const index = currentIndex();
          const pageSet = activePages();
          const page = pageSet[index];
          if (page.type === "browseIntro") {
            goToHotelBrowsing(getState());
            return;
          }
          const state = saveAnswer(page);
          if (hotelQuestionnaireMode && index === pageSet.length - 1) {
            goToReviewBrowsing(state);
            return;
          }
          if (postReviewMode && index === pageSet.length - 1) {
            finishPostReviewQuestionnaire(state);
            return;
          }
          const next = Math.min(index + 1, pageSet.length - 1);
          history.replaceState(null, "", pageUrl(next));
          render();
          window.scrollTo({ top: 0, behavior: "auto" });
        });

        window.addEventListener("popstate", () => {
          if (postReviewMode && location.hash === "#complete") renderCompletionScreen();
          else render();
        });

        window.addEventListener("online", () => flushSurveyOutbox("online"));
        window.addEventListener("pagehide", () => flushSurveyOutbox("pagehide", true));
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") flushSurveyOutbox("hidden", true);
        });
        window.MOCK_HOTEL_SURVEY_STORAGE_STATUS = function () {
          const state = getState();
          return {
            survey_user_id: state.survey_user_id || surveyUserId,
            submission_id: state.submission_id || "",
            study_condition: studyCondition,
            study_version: studyVersion,
            completion_status: state.completion_status || "in_progress",
            saved_answer_count: Object.keys(state.answers || {}).length,
            saved_event_count: getSurveyEvents().length,
            pending_delivery_count: getSurveyOutbox().length
          };
        };

        function validHashForMode() {
          const hash = location.hash || "";
          if (postReviewMode) return /^#pr\d+$/.test(hash) || hash === "#complete";
          if (hotelQuestionnaireMode) return /^#hq\d+$/.test(hash);
          return /^#q\d+$/.test(hash);
        }

        if (!location.hash || !validHashForMode()) {
          history.replaceState(null, "", pageUrl(0));
        }
        ensureRandomization();
        flushSurveyOutbox("page_load");
        if (postReviewMode && location.hash === "#complete") renderCompletionScreen();
        else render();
      })();
    </script>
  </body>
</html>
