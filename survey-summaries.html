<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey Summaries</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>Opening the survey...</p>
    <script>
      (function () {
        const params = new URLSearchParams(location.search || "");
        ["STUDENT_ID", "student_id", "PROLIFIC_PID", "prolific_pid", "SESSION_ID",
          "session_id", "participant_id", "submission_id", "study_condition",
          "survey_stage", "browsing_run"].forEach(key => params.delete(key));
        params.set("study_version", "3");
        location.replace(`index.html?${params.toString()}#q1`);
      })();
    </script>
  </body>
</html>
